[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shadows-explorer"
dynamic = ["version"]
description = "A modern file manager for Windows, macOS and Linux, built with PyQt6"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt6>=6.5"]

[project.optional-dependencies]
highlighting = ["Pygments>=2.10"]
dev = ["pytest>=7", "pyflakes>=3", "Pygments>=2.10"]

[project.gui-scripts]
shadows-explorer = "shadows_explorer.app:main"

[tool.setuptools.dynamic]
version = {attr = "shadows_explorer.__version__"}

[tool.setuptools.packages.find]
include = ["shadows_explorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
